---
- name: Remedyforce webhook listener
  hosts: localhost
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5023

  rules:
    - name: trigger playbook for test tickets
      condition: >-
        event.payload.task.queue == "REG-SO-SrOps-Automation"
        
      action:
       run_job_template:
          name: "Poll_test_Aruna"        # Job Template name in Controller
          organization: "Prudential"                # Your org name in Controller
   
      

