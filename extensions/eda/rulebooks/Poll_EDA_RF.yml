
---
- name: Remedyforce webhook listener
  hosts: localhost
  vars:
    inventory_map:
      "SG": 6      
      "MY": 4     
      "HK": 7

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5023

  rules:
    - name: trigger playbook for vm build
      condition: event.payload.task.summary is search("Base image Server Build")
      action:
        run_workflow_template:
         name: "vm test"
         organization: "Default"
         job_args:
          inventory: "{{ inventory_map[event.payload.dclocation] }}"
          extra_vars:
            task_number: "{{ event.payload.task.number_field }}"
     

    - name: trigger playbook for Backup server
      condition: event.payload.task.summary is search("Backup Configuration")
      action:
        run_workflow_template:
         name: "backup task"
         organization: "Default"
         job_args:
          extra_vars:
            task_number: "{{ event.payload.task.number_field }}"
           

    - name: trigger playbook for DNS check
      condition: event.payload.task.summary is search("To register server in DNS. - Enrolment on Scanning Tool")
      action:
        run_workflow_template:
         name: "DNS A Record Creation WorkFlow"
         organization: "Default"
         job_args:
          extra_vars:
            task_number: "{{ event.payload.task.number_field }}"
          

            
    - name: trigger playbook for free ip allocation
      condition: event.payload.task.summary is search("IP Address Update")
      action:
        run_job_template:
         name: "Free_Ip_Allocation"
         organization: "Prudential"
         job_args:
          extra_vars:
            task_number: "{{ event.payload.task.number_field }}"
           
    - name: trigger playbook for os config
      condition: event.payload.task.summary is search("OS Configuration")
      action:
        run_job_template:
         name: "Windows_Os_Config"
         organization: "Prudential"
         job_args:
          extra_vars:
            task_number: "{{ event.payload.task.number_field }}"
           

    - name: trigger playbook for SCCM
      condition: event.payload.task.summary is search("SCCM OR Package")
      action:
        run_job_template:
         name: "SCCM_Onboarding"
         organization: "Prudential"
         job_args:
          extra_vars:
            task_number: "{{ event.payload.task.number_field }}"
          

    - name: trigger playbook for Forcepoint
      condition: event.payload.task.summary is search("ForcePoint Update")
      action:
        run_job_template:
         name: "Forcepoint_Onboarding"
         organization: "Prudential"
         job_args:
          extra_vars:
            task_number: "{{ event.payload.task.number_field }}"
           


    - name: trigger playbook for Crowdstrike
      condition: event.payload.task.summary is search("CrowdStrike")
      action:
        run_job_template:
         name: "Crowdstrike_Onboarding"
         organization: "Prudential"
         job_args:
          extra_vars:
            task_number: "{{ event.payload.task.number_field }}"
            

    - name: trigger playbook for Dynatrace
      condition: event.payload.task.summary is search("Monitoring")
      actions:
       - run_job_template:
          name: "Dynatrace_Installation"
          organization: "Prudential"
          job_args:
           extra_vars:
            task_number: "{{ event.payload.task.number_field }}"
            #task_queue: "{{ event.payload.task.queue | default('')|string  }}"
            #task_number: "{{ event.payload.task.number_field | default('')|string  }}"
            #task_description: "{{ event.payload.task.description | default('')|string  }}"
            #summary: "{{ event.payload.task.summary | default('')|string  }}"

       - run_workflow_template:
           name: "Patrol Agent Installation Workflow"
           organization: "Default"
           job_args:
            extra_vars:
              task_number: "{{ event.payload.task.number_field }}"

    - name: trigger playbook for Discovery on boarding
      condition: event.payload.task.summary is search("Helix Discovery Scanning")
      action:
         run_job_template:
          name: "Discovery_Onboarding"
          organization: "Prudential"
          job_args:
           extra_vars:
            task_number: "{{ event.payload.task.number_field }}"
            

    - name: trigger playbook for CMDB status update
      condition: event.payload.task.summary is search("CMDB Status update to 'Being Assembled'")
      action:
         run_job_template:
          name: "CMDB_Onboarding_Status"
          organization: "Prudential"
          job_args:
           extra_vars:
            task_number: "{{ event.payload.task.number_field }}"

    - name: trigger playbook for CMDB status live update
      condition: event.payload.task.summary is search("Live")
      action:
         run_job_template:
          name: "CMDB_live_Onboarding"
          organization: "Prudential"
          job_args:
           extra_vars:
            task_number: "{{ event.payload.task.number_field }}"
            
            
    - name: trigger playbook for Cyberark PID onboarding
      condition: event.payload.task.summary is search("Enroll PID in CyberArk")
      action:
         run_job_template:
          name: "CyberArk Onboarding Template"
          organization: "Prudential"
          job_args:
           extra_vars:
            task_number: "{{ event.payload.task.number_field }}"

    - name: trigger playbook for Splunk task
      condition: event.payload.task.summary is search("Request to register the server in the Splunk")
      action:
         run_job_template:
          name: "Splunk_On_Boarding"
          organization: "Prudential"
          job_args:
           extra_vars:
            task_number: "{{ event.payload.task.number_field | default('')|string  }}"

    - name: trigger playbook for Qualys task
      condition: event.payload.task.summary is search("Request for Qualys Update")
      action:
         run_job_template:
          name: "Qualys On-Boarding Template"
          organization: "Prudential"
          job_args:
           extra_vars:
            task_number: "{{ event.payload.task.number_field | default('')  }}"

   
       
           
            #summary: "{{ event.payload.task.summary | default('')|string  }}"
    
  
