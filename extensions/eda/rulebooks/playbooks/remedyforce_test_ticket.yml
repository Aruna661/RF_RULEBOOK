---
- name: Handle Remedyforce test ticket
  hosts: localhost
  gather_facts: false
  tasks:
    - name: display the ctask number and description 
      ansible.builtin.debug:
        msg: 
          - "Task ID: {{ task_id }}"
          - "Task Number: {{ task_number }}"
          - "Queue: {{ task_queue }}"
          - "Description: {{ task_description }}"
          - "Description Dictionary: {{ description_dict }}"
          - "DC Location: {{ description_dict['DC Location'] }}"
          - "Number of Servers: {{ description_dict['Number of Servers'] }}"


          

